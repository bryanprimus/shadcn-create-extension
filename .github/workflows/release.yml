name: Release

# Every push to main tests, builds and publishes a GitHub Release with the
# Chrome and Firefox zips. When Chrome Web Store secrets are configured it
# also uploads the build to the store.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - name: E2E tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      # Stores need a higher version on every upload, so the patch number
      # comes from the run number: 0.1.<run>.
      - name: Set version
        id: version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          version="$base.${{ github.run_number }}"
          npm pkg set version="$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build zips
        run: |
          pnpm zip
          pnpm zip:firefox

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            .output/*.zip \
            --target "${{ github.sha }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "Built from ${{ github.sha }}. Download the chrome zip, unzip it, and use Load unpacked in chrome://extensions." \
            --latest

      - name: Chrome Web Store
        if: env.CHROME_EXTENSION_ID != ''
        env:
          CHROME_API_VERSION: v2
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: pnpm wxt submit --chrome-zip .output/*-chrome.zip
